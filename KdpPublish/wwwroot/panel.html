<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>KdpPublish — Control Panel</title>
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div class="ss-panel">
        <header class="ss-hdr">
            <div class="ss-hdr-counts" id="counts">— tracked</div>
        </header>

        <div class="ss-spinner-wrap" id="loading"><div class="ss-spinner"></div></div>

        <div id="main-body" style="display:none; display:contents;">
            <div class="ss-toolbar">
                <button id="btn-import-json" title="Merge tools/kdp JSON (title-ids.json, category trees, logs) into the KDP store">Import JSON</button>
                <button id="btn-export-json" title="Write the KDP store out as JSON to a new folder under %LocalAppData%\MindAttic\Prose\kdp-export">Export JSON</button>
            </div>

            <div class="ss-checklist">
                <table class="ss-table">
                    <thead>
                        <tr>
                            <th class="ss-col-check"></th>
                            <th class="ss-col-code">Code</th>
                            <th class="ss-col-icons"></th>
                            <th class="ss-col-version">Version</th>
                            <th class="ss-col-status">Status</th>
                            <th class="ss-col-published">Last Published</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>

            <button class="ss-start" id="btn-start">▶ Run Sequential Pass</button>
        </div>

        <div class="ss-log" id="log"></div>

        <div class="ss-modal-backdrop" id="modal-backdrop" style="display:none;">
            <div class="ss-modal">
                <div class="ss-modal-header">
                    <span id="modal-title"></span>
                    <button id="modal-close">✕</button>
                </div>
                <div class="ss-modal-body" id="modal-body"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var entries = [];
            var running = false;

            function post(msg) { window.chrome.webview.postMessage(msg); }

            function statusClass(e) {
                if (e.publicationStatus === 'Publishing') return 'publishing';
                if (e.needsRepublish) return 'flagged';
                if (e.publicationStatus === 'Published') return 'ok';
                if (e.publicationStatus === 'WorkInProgress') return 'wip';
                return 'warn';
            }

            function formatPublishedAt(value) {
                if (!value) return '—';
                var d = new Date(value);
                if (isNaN(d.getTime())) return '—';
                var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                var hours24 = d.getHours();
                var ampm = hours24 >= 12 ? 'PM' : 'AM';
                var hours12 = hours24 % 12; if (hours12 === 0) hours12 = 12;
                // One line, fixed shape: 2026-10-04 04:28 PM
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                    + ' ' + pad(hours12) + ':' + pad(d.getMinutes()) + ' ' + ampm;
            }

            function statusIcon(cls) {
                if (cls === 'ok') return '✓ ';
                if (cls === 'flagged') return '⟳ ';
                if (cls === 'wip') return '⚠ ';
                if (cls === 'publishing') return '⏳ ';
                return '';
            }

            // Replaces the old per-row checkbox: a book's "want it live" intent is now the
            // persisted Sign-Off/Hold gate (e.readyToPublish) rather than an in-page selection, so
            // each row shows exactly one of three states instead of a checkbox:
            //   - confirmed published (ground truth matched this run, or the status column
            //     already says Published) -> a read-only checkmark, nothing to click.
            //   - held but still live (readyToPublish=false yet PublishUrl is set) -> a warning
            //     glyph; automated unpublish isn't built yet, so this just flags it for a human —
            //     take it down by hand on kdp.amazon.com, then click Mark Unpublished here.
            //   - anything else (not yet live) -> a toggle icon reflecting readyToPublish, posting
            //     the existing sign-off/hold actions for just this one row.
            function buildCheckCell(e) {
                if (e.heldButLive) {
                    var warn = document.createElement('button');
                    warn.className = 'ss-check-glyph ss-check-warn';
                    warn.textContent = '⚠';
                    warn.title = 'Live on KDP but held. Automated unpublish isn’t built yet — take it down by hand on kdp.amazon.com, then click this to mark it unpublished locally.';
                    warn.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        post({ action: 'mark-unpublished', codes: [e.code] });
                    });
                    return warn;
                }
                // Published per the manifest/bookshelf, and not contradicted by a ground-truth
                // check THIS run (kdpGroundTruthMatchesExpected is only set once a pass has
                // actually visited the book and found it stale — see KdpReconcileService).
                var confirmedPublished = e.publicationStatus === 'Published' && e.kdpGroundTruthMatchesExpected !== false;
                if (confirmedPublished) {
                    var ok = document.createElement('span');
                    ok.className = 'ss-check-glyph ss-check-ok';
                    ok.textContent = '✓';
                    ok.title = e.kdpGroundTruthCheckedAt
                        ? 'Confirmed live as of this run’s sequential pass.'
                        : 'Published, per the last manifest/bookshelf read.';
                    return ok;
                }
                var toggle = document.createElement('button');
                toggle.className = 'ss-check-toggle' + (e.readyToPublish ? ' ss-check-toggle-on' : '');
                toggle.textContent = e.readyToPublish ? '●' : '○';
                toggle.title = e.readyToPublish
                    ? 'Signed off — included in the next sequential pass. Click to hold it back.'
                    : 'Held back — a pass skips it. Click to sign it off for the next pass.';
                toggle.addEventListener('click', function (ev) {
                    ev.stopPropagation();
                    post({ action: e.readyToPublish ? 'hold' : 'sign-off', codes: [e.code] });
                });
                return toggle;
            }

            // Fixed universe ordering — anything not in this list (unexpected/new universe
            // slugs) still renders, just sorted alphabetically after these four.
            var UNIVERSE_ORDER = ['glmz', 'scry', 'source', 'epic'];

            function groupByUniverse(list) {
                var groups = {};
                list.forEach(function (e) {
                    var key = (e.universe || 'other').toLowerCase();
                    (groups[key] = groups[key] || []).push(e);
                });
                var keys = Object.keys(groups).sort(function (a, b) {
                    var ia = UNIVERSE_ORDER.indexOf(a), ib = UNIVERSE_ORDER.indexOf(b);
                    if (ia === -1) ia = UNIVERSE_ORDER.length;
                    if (ib === -1) ib = UNIVERSE_ORDER.length;
                    return ia !== ib ? ia - ib : a.localeCompare(b);
                });
                return keys.map(function (k) { return { universe: k, items: groups[k] }; });
            }

            function render() {
                document.getElementById('counts').textContent = entries.length + ' tracked';
                var tbody = document.getElementById('rows');
                tbody.innerHTML = '';

                groupByUniverse(entries).forEach(function (group) {
                    var trHeader = document.createElement('tr');
                    trHeader.className = 'ss-group-row';
                    var tdHeader = document.createElement('td');
                    tdHeader.className = 'ss-group-header';
                    tdHeader.colSpan = 6;
                    tdHeader.textContent = group.universe.toUpperCase() + ' (' + group.items.length + ')';
                    trHeader.appendChild(tdHeader);
                    tbody.appendChild(trHeader);

                    group.items.forEach(function (e) {
                        var tr = document.createElement('tr');
                        tr.className = 'ss-row';

                        var tdCheck = document.createElement('td');
                        tdCheck.className = 'ss-col-check';
                        tdCheck.appendChild(buildCheckCell(e));

                        var tdCode = document.createElement('td');
                        tdCode.className = 'ss-col-code';
                        tdCode.title = e.title + (e.readyToPublish ? '' : ' — not signed off, will be skipped');
                        tdCode.textContent = e.code;

                        var tdIcons = document.createElement('td');
                        tdIcons.className = 'ss-col-icons';
                        var notesBtn = document.createElement('button');
                        notesBtn.className = 'ss-icon-btn';
                        notesBtn.title = 'View description.txt';
                        notesBtn.textContent = '▤';
                        notesBtn.addEventListener('click', function (ev) { ev.stopPropagation(); openNotesModal(e); });
                        var coverBtn = document.createElement('button');
                        coverBtn.className = 'ss-icon-btn';
                        coverBtn.title = 'Preview cover.jpg';
                        coverBtn.textContent = '🖼';
                        coverBtn.addEventListener('click', function (ev) { ev.stopPropagation(); openCoverModal(e); });
                        tdIcons.appendChild(notesBtn);
                        tdIcons.appendChild(coverBtn);

                        var tdVer = document.createElement('td');
                        tdVer.className = 'ss-col-version';
                        var publishedVer = e.localPublishMarker ? e.localPublishMarker.version : null;
                        tdVer.textContent = (publishedVer != null && publishedVer !== e.version)
                            ? ('v' + publishedVer + ' < v' + e.version)
                            : ('v' + e.version);

                        var tdStatus = document.createElement('td');
                        tdStatus.className = 'ss-col-status';
                        var span = document.createElement('span');
                        var cls = statusClass(e);
                        span.className = 'ss-status ss-status-' + cls;
                        span.textContent = statusIcon(cls) + e.publicationStatus;
                        if (e.kdpStatus) span.title = 'On the KDP bookshelf: ' + e.kdpStatus + (e.kdpLiveState ? ' (' + e.kdpLiveState + ')' : '');
                        tdStatus.appendChild(span);

                        var tdPublished = document.createElement('td');
                        tdPublished.className = 'ss-col-published';
                        tdPublished.textContent = formatPublishedAt(e.kdpPublishedAt);
                        if (e.kdpPublishedAt) tdPublished.title = e.kdpPublishedAt;

                        tr.appendChild(tdCheck);
                        tr.appendChild(tdCode);
                        tr.appendChild(tdIcons);
                        tr.appendChild(tdVer);
                        tr.appendChild(tdStatus);
                        tr.appendChild(tdPublished);
                        tbody.appendChild(tr);
                    });
                });

                var startBtn = document.getElementById('btn-start');
                startBtn.textContent = running ? 'Running…' : '▶ Run Sequential Pass';
                startBtn.disabled = running || entries.length === 0;
            }

            document.getElementById('btn-import-json').addEventListener('click', function () {
                post({ action: 'import-json' });
            });
            document.getElementById('btn-export-json').addEventListener('click', function () {
                post({ action: 'export-json' });
            });
            document.getElementById('btn-start').addEventListener('click', function () {
                post({ action: 'run-pass' });
            });

            function openModal(title, bodyHtml) {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-body').innerHTML = bodyHtml;
                document.getElementById('modal-backdrop').style.display = 'flex';
            }
            function closeModal() {
                document.getElementById('modal-backdrop').style.display = 'none';
                pendingCoverCode = null;
            }
            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('modal-backdrop').addEventListener('click', function (ev) {
                if (ev.target.id === 'modal-backdrop') closeModal();
            });

            function escapeHtml(s) {
                return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function openNotesModal(e) {
                var text = e.description && e.description.trim().length > 0 ? e.description : '(no description.txt found)';
                openModal(e.code + ' — Description', '<pre class="ss-modal-text">' + escapeHtml(text) + '</pre>');
            }

            // Guards against a stale cover response landing after the user closed the modal or
            // clicked a different book's cover icon before the previous request came back.
            var pendingCoverCode = null;
            function openCoverModal(e) {
                pendingCoverCode = e.code;
                openModal(e.code + ' — Cover', '<div class="ss-modal-loading">Loading…</div>');
                post({ action: 'get-cover', code: e.code });
            }

            // C# calls these via ExecuteScriptAsync.
            window.ssPanel = {
                onManifest: function (entriesJson) {
                    // No selection to preserve or default anymore — readyToPublish (sign-off) is
                    // the persisted source of truth, straight from the manifest every load.
                    entries = JSON.parse(entriesJson);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('main-body').style.display = 'contents';
                    render();
                },
                onLog: function (line) {
                    var div = document.createElement('div');
                    div.className = 'ss-log-line';
                    div.textContent = line;
                    var log = document.getElementById('log');
                    log.appendChild(div);
                    log.scrollTop = log.scrollHeight;
                },
                onRunState: function (isRunning) {
                    running = isRunning;
                    render();
                },
                onCoverImage: function (code, dataUri) {
                    if (code !== pendingCoverCode) return;
                    if (!dataUri) {
                        document.getElementById('modal-body').innerHTML = '<div class="ss-modal-loading">(no cover.jpg found)</div>';
                        return;
                    }
                    document.getElementById('modal-body').innerHTML = '<img class="ss-modal-cover" src="' + dataUri + '">';
                }
            };

            // Live Observation (AutoWebNav): what an attached observer (awn-observe) reports for
            // this pane — the app's own view of itself, not a guess from the DOM.
            window.__awnObserve = function () {
                var counts = {};
                entries.forEach(function (e) { counts[e.publicationStatus] = (counts[e.publicationStatus] || 0) + 1; });
                return {
                    running: running,
                    summary: entries.length + ' tracked · ' +
                        Object.keys(counts).map(function (k) { return counts[k] + ' ' + k; }).join(', '),
                    log: Array.from(document.querySelectorAll('#log .ss-log-line')).map(function (d) { return d.textContent; })
                };
            };

            post({ action: 'ready' });
        })();
    </script>
</body>
</html>
